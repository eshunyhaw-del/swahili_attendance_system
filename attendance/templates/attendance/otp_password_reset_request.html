{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="csrf-token" content="{{ csrf_token }}">
<title>Reset password | SWASA Attendance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="{% static 'js/iconify.min.js' %}"></script>
<link rel="stylesheet" href="{% static 'css/auth.css' %}">
</head>
<body>
<main class="card">
    <div class="card-top">
        <div class="brand-icon"><span class="iconify" data-icon="mdi:lock-reset"></span></div>
        <h1>Reset password</h1>
        <div class="card-top-sub">We'll send a 6-digit code to your email</div>
        <div class="steps">
            <span class="step-item active"><span class="step-dot">1</span> Your email</span>
            <span class="step-line"></span>
            <span class="step-item"><span class="step-dot">2</span> Enter code</span>
            <span class="step-line"></span>
            <span class="step-item"><span class="step-dot">3</span> New password</span>
        </div>
    </div>
    <div class="card-body">
        <div id="welcomeBanner" style="display:none;" class="welcome-banner">
            <span class="iconify" data-icon="mdi:information-outline" style="font-size:16px;"></span>
            <span id="welcomeBannerText"></span>
            <button type="button" class="banner-close" onclick="document.getElementById('welcomeBanner').style.display='none';" aria-label="Dismiss">&times;</button>
        </div>
        <form method="post">
            {% csrf_token %}
            <div class="field">
                <label class="field-label" for="email">Email address</label>
                <input type="email" id="email" name="email" class="field-input" placeholder="you@example.com" required autocomplete="email">
                <div class="field-hint">Enter the email linked to your account. Code expires in 5 minutes.</div>
            </div>
            <button type="submit" class="btn-send">
                Send verification code
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
            </button>
        </form>
        <a href="{% url 'login' %}" class="back-link">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
            Back to sign in
        </a>
    </div>
</main>
<script>
document.addEventListener('DOMContentLoaded', function () {
    var emailInput = document.getElementById('email');
    var wb = document.getElementById('welcomeBanner');
    var wbText = document.getElementById('welcomeBannerText');
    var TEN_MIN = 600000;
    var storedEmail = sessionStorage.getItem('swasa_otp_email');
    var storedFlow = sessionStorage.getItem('swasa_otp_flow');
    var storedTs = parseInt(sessionStorage.getItem('swasa_otp_timestamp') || '0', 10);
    if (storedEmail && storedFlow === 'password-reset') {
        emailInput.value = storedEmail;
        if (Date.now() - storedTs < TEN_MIN) {
            wbText.textContent = 'Welcome back! Enter the code sent to ' + storedEmail;
            wb.style.display = 'flex';
        } else {
            ['swasa_otp_email', 'swasa_otp_flow', 'swasa_otp_timestamp'].forEach(function (k) { sessionStorage.removeItem(k); });
            wbText.textContent = 'Your code has expired. Please request a new one.';
            wb.style.display = 'flex';
        }
    }
    function saveEmail() {
        var val = emailInput.value.trim();
        if (val) {
            sessionStorage.setItem('swasa_otp_email', val);
            sessionStorage.setItem('swasa_otp_flow', 'password-reset');
            sessionStorage.setItem('swasa_otp_timestamp', String(Date.now()));
        }
    }
    emailInput.addEventListener('blur', saveEmail);
    document.querySelector('form').addEventListener('submit', saveEmail);
});
</script>
</body>
</html>
