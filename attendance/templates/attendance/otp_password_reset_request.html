{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="csrf-token" content="{{ csrf_token }}">
<title>Reset password — SWASA Attendance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="{% static 'js/iconify.min.js' %}"></script>
<style>
    :root { --navy: #0D2472; --navy-deep: #081A52; --gold: #E6B325;
        --ink: #16203C; --muted: #5B6577; --line: #E5E8F0; --field-line: #D2D8E6;
        --bg: #EEF1F8; --white: #FFFFFF; }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Montserrat', system-ui, sans-serif; color: var(--ink);
        background: radial-gradient(1000px 500px at 15% -10%, rgba(13,36,114,0.09), transparent 60%),
            radial-gradient(800px 460px at 100% 110%, rgba(230,179,37,0.07), transparent 55%), var(--bg);
        min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem 1rem; -webkit-font-smoothing: antialiased; }
    .card { width: 100%; max-width: 420px; background: var(--white); border: 1px solid var(--line);
        border-radius: 18px; overflow: hidden; box-shadow: 0 26px 60px -28px rgba(13,36,114,0.28); }
    .card-top { padding: 1.9rem 2rem 1.5rem; text-align: center; border-bottom: 1px solid var(--line); position: relative; }
    .card-top::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--navy), var(--gold)); }
    .brand-icon { width: 48px; height: 48px; border-radius: 14px; background: rgba(13,36,114,0.07); color: var(--navy);
        display: inline-flex; align-items: center; justify-content: center; font-size: 24px; margin-bottom: 0.9rem; }
    .card-top h1 { font-size: 1.3rem; font-weight: 700; letter-spacing: -0.02em; }
    .card-top-sub { margin-top: 0.3rem; font-size: 0.78rem; color: var(--muted); font-weight: 500; }
    .steps { display: flex; align-items: center; justify-content: center; margin-top: 1.25rem; }
    .step-item { display: flex; align-items: center; gap: 0.4rem; font-size: 0.7rem; font-weight: 600; color: #A2AAB9; }
    .step-item.active { color: var(--navy); }
    .step-dot { width: 21px; height: 21px; border-radius: 50%; background: #ECEFF6; color: #97A0B2; display: flex; align-items: center; justify-content: center; font-size: 0.68rem; font-weight: 700; }
    .step-item.active .step-dot { background: var(--navy); color: #fff; }
    .step-line { width: 24px; height: 1.5px; background: var(--line); margin: 0 0.5rem; }
    .card-body { padding: 1.6rem 2rem 2rem; }
    .welcome-banner { display: flex; align-items: flex-start; gap: 0.5rem; background: rgba(230,179,37,0.10);
        border: 1px solid rgba(230,179,37,0.35); border-left: 3px solid var(--gold); border-radius: 10px;
        padding: 0.65rem 0.85rem; font-size: 0.78rem; color: #7A5E12; line-height: 1.45; margin-bottom: 1rem; }
    .welcome-banner .iconify { flex-shrink: 0; margin-top: 1px; }
    .banner-close { margin-left: auto; background: none; border: none; color: var(--muted); cursor: pointer; font-size: 17px; line-height: 1; padding: 0 0 0 0.5rem; }
    .field { margin-bottom: 0.9rem; }
    .field-label { display: block; font-size: 0.73rem; font-weight: 600; color: var(--ink); margin-bottom: 0.35rem; }
    .field-hint { font-size: 0.68rem; color: var(--muted); margin-top: 0.35rem; }
    .field-input { width: 100%; padding: 0.75rem 0.9rem; font-family: inherit; font-size: 0.88rem; font-weight: 500;
        color: var(--ink); background: #FBFCFE; border: 1.5px solid var(--field-line); border-radius: 10px; outline: none;
        transition: border-color 0.15s, box-shadow 0.15s, background 0.15s; }
    .field-input::placeholder { color: #9AA3B5; font-weight: 400; }
    .field-input:focus { border-color: var(--navy); background: #fff; box-shadow: 0 0 0 3px rgba(13,36,114,0.12); }
    .btn-send { width: 100%; padding: 0.85rem; background: var(--navy); color: #fff; border: none; border-radius: 10px;
        font-family: inherit; font-size: 0.9rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.5rem; transition: background 0.15s, transform 0.05s; margin-top: 0.35rem; }
    .btn-send:hover { background: var(--navy-deep); }
    .btn-send:active { transform: translateY(1px); }
    .back-link { display: flex; align-items: center; justify-content: center; gap: 0.3rem; margin-top: 1.1rem;
        font-size: 0.78rem; font-weight: 600; color: var(--muted); text-decoration: none; transition: color 0.15s; }
    .back-link:hover { color: var(--navy); }
</style>
</head>
<body>
<main class="card">
    <div class="card-top">
        <div class="brand-icon"><span class="iconify" data-icon="mdi:lock-reset"></span></div>
        <h1>Reset password</h1>
        <div class="card-top-sub">We'll send a 6-digit code to your email</div>
        <div class="steps">
            <span class="step-item active"><span class="step-dot">1</span> Your email</span>
            <span class="step-line"></span>
            <span class="step-item"><span class="step-dot">2</span> Enter code</span>
            <span class="step-line"></span>
            <span class="step-item"><span class="step-dot">3</span> New password</span>
        </div>
    </div>
    <div class="card-body">
        <div id="welcomeBanner" style="display:none;" class="welcome-banner">
            <span class="iconify" data-icon="mdi:information-outline" style="font-size:16px;"></span>
            <span id="welcomeBannerText"></span>
            <button type="button" class="banner-close" onclick="document.getElementById('welcomeBanner').style.display='none';" aria-label="Dismiss">&times;</button>
        </div>
        <form method="post">
            {% csrf_token %}
            <div class="field">
                <label class="field-label" for="email">Email address</label>
                <input type="email" id="email" name="email" class="field-input" placeholder="you@example.com" required autocomplete="email">
                <div class="field-hint">Enter the email linked to your account. Code expires in 5 minutes.</div>
            </div>
            <button type="submit" class="btn-send">
                Send verification code
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
            </button>
        </form>
        <a href="{% url 'login' %}" class="back-link">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
            Back to sign in
        </a>
    </div>
</main>
<script>
document.addEventListener('DOMContentLoaded', function () {
    var emailInput = document.getElementById('email');
    var wb = document.getElementById('welcomeBanner');
    var wbText = document.getElementById('welcomeBannerText');
    var TEN_MIN = 600000;
    var storedEmail = sessionStorage.getItem('swasa_otp_email');
    var storedFlow = sessionStorage.getItem('swasa_otp_flow');
    var storedTs = parseInt(sessionStorage.getItem('swasa_otp_timestamp') || '0', 10);
    if (storedEmail && storedFlow === 'password-reset') {
        emailInput.value = storedEmail;
        if (Date.now() - storedTs < TEN_MIN) {
            wbText.textContent = 'Welcome back! Enter the code sent to ' + storedEmail;
            wb.style.display = 'flex';
        } else {
            ['swasa_otp_email', 'swasa_otp_flow', 'swasa_otp_timestamp'].forEach(function (k) { sessionStorage.removeItem(k); });
            wbText.textContent = 'Your code has expired. Please request a new one.';
            wb.style.display = 'flex';
        }
    }
    function saveEmail() {
        var val = emailInput.value.trim();
        if (val) {
            sessionStorage.setItem('swasa_otp_email', val);
            sessionStorage.setItem('swasa_otp_flow', 'password-reset');
            sessionStorage.setItem('swasa_otp_timestamp', String(Date.now()));
        }
    }
    emailInput.addEventListener('blur', saveEmail);
    document.querySelector('form').addEventListener('submit', saveEmail);
});
</script>
</body>
</html>
