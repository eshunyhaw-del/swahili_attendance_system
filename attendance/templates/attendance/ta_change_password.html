{% extends "attendance/base.html" %}
{% block title %}Change Password{% endblock %}

{% block content %}
<style>
:root {
    --primary: #0D2472;
    --primary-lt: rgba(13,36,114,0.07);
    --surface: #FFFFFF;
    --bg: #F4F6F9;
    --text: #1F2937;
    --muted: #6B7484;
    --border: #E1E5EC;
    --red: #DC2626;
    --red-lt: rgba(220,38,38,0.08);
    --green: #167A4B;
    --r-sm: 8px; --r-lg: 12px; --r-xl: 14px;
    --sh-sm: 0 1px 2px rgba(16,24,40,0.06), 0 1px 3px rgba(16,24,40,0.08);
    --sh-md: 0 2px 4px -2px rgba(16,24,40,0.06), 0 4px 10px -2px rgba(16,24,40,0.08);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html[data-theme="dark"] {
    --primary: #1B3A9C; --primary-lt: rgba(242,195,26,0.10);
    --surface: #171F2A; --bg: #0E141C;
    --text: #E7ECF2; --muted: #8B95A5; --border: #29323F;
    --green: #4ED08A; --green-lt: rgba(22,122,75,0.20);
    --amber: #E6A23C; --amber-lt: rgba(180,83,9,0.20);
    --red: #F0776B; --red-lt: rgba(180,35,24,0.20);
    --blue: #6AA0F0; --blue-lt: rgba(23,92,211,0.20);
    --sh-sm: 0 1px 3px rgba(0,0,0,0.45);
    --sh-md: 0 4px 10px -2px rgba(0,0,0,0.5);
    --sh-lg: 0 12px 20px -4px rgba(0,0,0,0.55);
}
body { background: var(--bg) !important; font-family: 'Montserrat', system-ui, sans-serif; color: var(--text); }

.wrap { max-width: 480px; margin: 0 auto; padding: 1.5rem 1rem 4rem; }

.page-header {
    background: var(--primary);
    color: #fff; border-radius: var(--r-xl);
    padding: 1.5rem 1.75rem; margin-bottom: 1.5rem;
    position: relative; overflow: hidden; box-shadow: var(--sh-md);
}
.page-header h1 { font-size: 1.35rem; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 0.2rem; }
.page-header-sub { font-size: 12.5px; opacity: 0.68; font-weight: 500; }

.card {
    background: var(--surface);
    border-radius: var(--r-xl);
    box-shadow: var(--sh-sm);
    padding: 1.5rem 1.75rem;
}

.error-banner {
    background: var(--red-lt);
    border: 1px solid rgba(220,38,38,0.2);
    border-radius: var(--r-sm);
    padding: 0.75rem 1rem;
    display: flex; align-items: flex-start; gap: 0.5rem;
    font-size: 13px; color: var(--red); margin-bottom: 1.25rem; line-height: 1.5;
}
.error-banner .iconify { font-size: 16px; flex-shrink: 0; margin-top: 1px; }

.form-group { margin-bottom: 1.125rem; }
.form-label {
    display: block; font-size: 13px; font-weight: 700; color: var(--text);
    margin-bottom: 0.4rem;
}
.input-wrap { position: relative; }
.form-input {
    width: 100%;
    padding: 0.65rem 2.5rem 0.65rem 0.875rem;
    border: 1.5px solid var(--border);
    border-radius: var(--r-sm);
    font-family: inherit; font-size: 14px; color: var(--text);
    background: var(--surface);
    outline: none; transition: border-color 0.13s;
}
.form-input:focus { border-color: var(--primary); background: var(--surface); }
html[data-theme="dark"] .form-input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(242,195,26,0.15); }
.toggle-pw {
    position: absolute; right: 0.65rem; top: 50%; transform: translateY(-50%);
    background: none; border: none; cursor: pointer;
    color: var(--muted); font-size: 18px; padding: 0; line-height: 1;
}
.toggle-pw:hover { color: var(--primary); }
html[data-theme="dark"] .toggle-pw:hover { color: var(--gold); }

.hint { font-size: 11.5px; color: var(--muted); margin-top: 0.3rem; }

.divider { border: none; border-top: 1px solid var(--border); margin: 1.5rem 0; }

.btn-row { display: flex; gap: 0.625rem; justify-content: flex-end; }

.btn-cancel {
    padding: 0.65rem 1.25rem;
    border: 1.5px solid var(--border);
    border-radius: var(--r-sm);
    background: transparent; color: var(--muted);
    font-family: inherit; font-size: 13.5px; font-weight: 700;
    cursor: pointer; text-decoration: none;
    display: inline-flex; align-items: center; transition: all 0.13s;
}
.btn-cancel:hover { border-color: var(--primary); color: var(--primary); }

.btn-save {
    padding: 0.65rem 1.5rem;
    background: var(--primary); color: #fff;
    border: none; border-radius: var(--r-sm);
    font-family: inherit; font-size: 13.5px; font-weight: 700;
    cursor: pointer; display: inline-flex; align-items: center; gap: 0.4rem;
    transition: all 0.13s; box-shadow: 0 2px 6px rgba(13,36,114,0.22);
}
.btn-save:hover { background: #0a1b5c; transform: translateY(-1px); box-shadow: 0 4px 10px rgba(13,36,114,0.28); }
.btn-save:active { transform: scale(0.97); }
</style>

<div class="wrap">

<div class="page-header">
<h1>Change Password</h1>
<div class="page-header-sub">Choose a strong password to keep your account secure</div>
</div>

<div class="card">
        {% if error %}
<div class="error-banner">
<span class="iconify" data-icon="mdi:alert-circle-outline"></span>
            {{ error }}
</div>
        {% endif %}

<form method="post">
            {% csrf_token %}

<div class="form-group">
<label class="form-label" for="current_password">Current Password</label>
<div class="input-wrap">
<input type="password" id="current_password" name="current_password"
                           class="form-input" autocomplete="current-password" required>
<button type="button" class="toggle-pw" onclick="togglePw('current_password', this)">
<span class="iconify" data-icon="mdi:eye-outline"></span>
</button>
</div>
</div>

<hr class="divider">

<div class="form-group">
<label class="form-label" for="new_password">New Password</label>
<div class="input-wrap">
<input type="password" id="new_password" name="new_password"
                           class="form-input" autocomplete="new-password" required>
<button type="button" class="toggle-pw" onclick="togglePw('new_password', this)">
<span class="iconify" data-icon="mdi:eye-outline"></span>
</button>
</div>
<div class="hint">At least 8 characters.</div>
</div>

<div class="form-group">
<label class="form-label" for="confirm_password">Confirm New Password</label>
<div class="input-wrap">
<input type="password" id="confirm_password" name="confirm_password"
                           class="form-input" autocomplete="new-password" required>
<button type="button" class="toggle-pw" onclick="togglePw('confirm_password', this)">
<span class="iconify" data-icon="mdi:eye-outline"></span>
</button>
</div>
</div>

<div class="btn-row">
<a href="{% url 'attendance:ta_dashboard' %}" class="btn-cancel">Cancel</a>
<button type="submit" class="btn-save">
Update Password
</button>
</div>
</form>
</div>

</div>

<script>
function togglePw(id, btn) {
    const input = document.getElementById(id);
    const icon = btn.querySelector('.iconify');
    if (input.type === 'password') {
        input.type = 'text';
        icon.setAttribute('data-icon', 'mdi:eye-off-outline');
    } else {
        input.type = 'password';
        icon.setAttribute('data-icon', 'mdi:eye-outline');
    }
}
</script>
{% endblock %}
