{% extends "attendance/base.html" %}
{% block content %}
<div style="max-width:420px;margin:80px auto;padding:0 16px;">
    <div class="card" style="padding:32px;">
        <h2 style="margin-bottom:8px;">Set Your Password</h2>
        <p style="color:var(--text-muted);margin-bottom:24px;">
            Your default password is your Student ID. Please choose a new password before continuing.
        </p>

        {% if error %}
        <div class="alert alert-error" style="margin-bottom:16px;">{{ error }}</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label>New Password</label>
                <input type="password" name="new_password" class="form-control" required minlength="8" autofocus>
                <small style="color:var(--text-muted);">Minimum 8 characters. Cannot be your Student ID.</small>
            </div>
            <div class="form-group" style="margin-top:16px;">
                <label>Confirm Password</label>
                <input type="password" name="confirm_password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;margin-top:24px;">
                Change Password &amp; Continue
            </button>
        </form>
    </div>
</div>
{% endblock %}
