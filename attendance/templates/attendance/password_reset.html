<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Reset Password - SWASA Attendance</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>(function(){var t=localStorage.getItem('swasa_theme')||'light';document.documentElement.setAttribute('data-theme',t);})();</script>
    <script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>
    <style>
        :root {
            --primary: #0D2472;
            --primary-hover: #091A55;
            --primary-light: rgba(13,36,114,0.08);
            --surface: #FFFFFF;
            --bg-main: #F4F6FB;
            --text-main: #0D1B3E;
            --text-muted: #8896AB;
            --border: #E4E9F2;
            --success: #1E9E5E;
            --success-light: rgba(30,158,94,0.1);
            --radius-lg: 20px;
            --radius-sm: 8px;
            --shadow-lg: 0 10px 25px -5px rgba(13,36,114,0.1);
            --transition: all 0.2s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', system-ui, sans-serif;
            background: var(--bg-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .reset-container { max-width: 440px; width: 100%; }

        .reset-card {
            background: var(--surface);
            border-radius: var(--radius-lg);
            padding: 2.5rem;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-lg);
            position: relative;
        }

        .reset-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), #1B3A9C, #F2C31A);
            border-radius: var(--radius-lg) var(--radius-lg) 0 0;
        }

        .icon-circle {
            width: 56px;
            height: 56px;
            background: var(--primary-light);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.25rem;
        }

        h2 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--text-main);
            text-align: center;
            letter-spacing: -0.02em;
        }

        p {
            color: var(--text-muted);
            margin-bottom: 1.75rem;
            text-align: center;
            font-size: 0.85rem;
            line-height: 1.5;
        }

        .input-wrapper {
            position: relative;
            margin-bottom: 1.5rem;
        }

        input {
            width: 100%;
            padding: 0.85rem 1rem 0.85rem 2.75rem;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            font-family: 'DM Sans', monospace;
            font-weight: 500;
            color: var(--text-main);
            background: var(--surface);
            transition: var(--transition);
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        .input-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1.1rem;
            pointer-events: none;
        }

        button {
            background: var(--primary);
            color: white;
            width: 100%;
            padding: 0.85rem;
            border: none;
            border-radius: var(--radius-sm);
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        button:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .back-link {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.8rem;
        }

        .back-link a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .errorlist {
            list-style: none;
            background: rgba(211, 47, 47, 0.1);
            color: #D32F2F;
            font-size: 0.75rem;
            padding: 0.5rem;
            border-radius: var(--radius-sm);
            margin-top: 0.5rem;
        }
        html[data-theme="dark"] body { background: #0F1923 !important; }
        html[data-theme="dark"] .reset-card { background: #1E2A3B !important; border-color: #2E3D50 !important; color: #E8EDF5; }
        html[data-theme="dark"] h2 { color: #E8EDF5; }
        html[data-theme="dark"] p  { color: #8896AB; }
        html[data-theme="dark"] input { background: #162131 !important; color: #E8EDF5 !important; border-color: #2E3D50 !important; }
        html[data-theme="dark"] input:focus { border-color: #F2C31A !important; box-shadow: 0 0 0 3px rgba(242,195,26,0.15) !important; }
        html[data-theme="dark"] .icon-circle { background: rgba(242,195,26,0.1) !important; }
        html[data-theme="dark"] .icon-circle .iconify { color: #F2C31A !important; }
        html[data-theme="dark"] .back-link a { color: #F2C31A !important; }
    </style>
</head>
<body>
<div class="reset-container">
    <div class="reset-card">
        <div class="icon-circle">
            <span class="iconify" data-icon="lucide:key" data-width="28" data-height="28" style="color: var(--primary);"></span>
        </div>
        <h2>Reset Password</h2>
        <p>Enter your email address and we'll send you a link to reset your password.</p>
        
        <form method="post">
            {% csrf_token %}
            <div class="input-wrapper">
                {{ form.email }}
                <span class="input-icon iconify" data-icon="lucide:mail"></span>
            </div>
            {{ form.email.errors }}
            <button type="submit">
                <span class="iconify" data-icon="lucide:send"></span>
                Send Reset Link
            </button>
        </form>
        
        <div class="back-link">
            <a href="{% url 'login' %}">
                <span class="iconify" data-icon="lucide:arrow-left"></span>
                Back to login
            </a>
        </div>
    </div>
</div>
</body>
</html>
