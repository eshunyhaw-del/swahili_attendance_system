{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>Password Reset Complete - SWASA Attendance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
<script>(function(){var t=localStorage.getItem('swasa_theme')||'light';document.documentElement.setAttribute('data-theme',t);})();</script>
<script src="{% static 'js/iconify.min.js' %}"></script>
<style>
        :root {
            --primary: #0D2472;
            --surface: #FFFFFF;
            --bg-main: #EEF1F8;
            --text-main: #1A1A2E;
            --text-muted: #6B7280;
            --border: #E5E8F0;
            --success: #1E9E5E;
            --success-light: rgba(30,158,94,0.1);
            --radius-lg: 20px;
            --shadow-lg: 0 10px 25px -5px rgba(13,36,114,0.1);
            --transition: all 0.2s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .success-card {
            background: var(--surface);
            border-radius: var(--radius-lg);
            max-width: 440px;
            width: 100%;
            padding: 2.5rem;
            box-shadow: var(--shadow-lg);
            text-align: center;
            position: relative;
        }

        .success-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), #1B3A9C);
            border-radius: var(--radius-lg) var(--radius-lg) 0 0;
        }

        .icon-circle {
            width: 64px;
            height: 64px;
            background: var(--success-light);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.25rem;
        }

        h2 { 
            font-size: 1.5rem; 
            font-weight: 700; 
            margin-bottom: 0.5rem; 
            color: var(--text-main); 
            letter-spacing: -0.02em;
        }

        p { 
            color: var(--text-muted); 
            margin-bottom: 1.75rem; 
            font-size: 0.85rem;
            line-height: 1.5;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            background: var(--primary);
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.85rem;
            transition: var(--transition);
        }

        .btn:hover {
            background: #091A55;
            transform: translateY(-1px);
        }

        @media (max-width: 480px) {
            .success-card { padding: 1.5rem; }
            h2 { font-size: 1.3rem; }
        }
        html[data-theme="dark"] body { background: #0F1923 !important; }
        html[data-theme="dark"] .success-card { background: #1E2A3B !important; border-color: #2E3D50 !important; }
        html[data-theme="dark"] h2 { color: #E8EDF5; }
        html[data-theme="dark"] p { color: #8896AB; }
        html[data-theme="dark"] .icon-circle { background: rgba(26,158,94,0.12) !important; }
</style>
</head>
<body>
<div class="success-card">
<div class="icon-circle">
<span class="iconify" data-icon="lucide:check-circle" data-width="32" data-height="32" style="color: var(--success);"></span>
</div>
<h2>Password reset complete!</h2>
<p>Your password has been successfully changed. You can now log in with your new password.</p>
<a href="{% url 'login' %}" class="btn">
Login to your account
</a>
</div>
</body>
</html>
