{% extends "attendance/base.html" %}
{% block title %}Know Your Executives — SWASA{% endblock %}

{% block content %}
<style>
@keyframes pulse-ring {
    0%   { transform: scale(0.9); opacity: 0.7; }
    70%  { transform: scale(1.3); opacity: 0; }
    100% { transform: scale(0.9); opacity: 0; }
}
@keyframes pulse-dot {
    0%, 100% { transform: scale(1); }
    50%       { transform: scale(1.08); }
}

.cs-wrap { max-width: 600px; margin: 0 auto; padding: 0 0 4rem; }

.cs-card {
    background: linear-gradient(160deg, #0D2472 0%, #091A55 50%, #0A1E72 100%);
    border-radius: 24px;
    padding: 3rem 2rem;
    text-align: center;
    position: relative;
    overflow: hidden;
    box-shadow: 0 8px 40px rgba(13,36,114,0.35);
    border: 1px solid rgba(242,195,26,0.18);
}
.cs-card::before {
    content: '';
    position: absolute; top: -60px; right: -60px;
    width: 220px; height: 220px;
    background: rgba(242,195,26,0.06); border-radius: 50%;
    pointer-events: none;
}
.cs-card::after {
    content: '';
    position: absolute; bottom: -80px; left: -40px;
    width: 240px; height: 240px;
    background: rgba(242,195,26,0.04); border-radius: 50%;
    pointer-events: none;
}

.cs-logo {
    width: 72px; height: 72px;
    background: var(--gold);
    border-radius: 18px;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 1.75rem;
    font-size: 22px; font-weight: 800; color: #0D2472;
    letter-spacing: 0.03em;
    position: relative; z-index: 1;
    box-shadow: 0 4px 20px rgba(242,195,26,0.4);
}

.cs-pulse-wrap {
    position: relative;
    width: 80px; height: 80px;
    margin: 0 auto 1.5rem;
    display: flex; align-items: center; justify-content: center;
    z-index: 1;
}
.cs-pulse-ring {
    position: absolute; inset: 0;
    border-radius: 50%;
    background: rgba(242,195,26,0.25);
    animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
}
.cs-pulse-dot {
    width: 52px; height: 52px;
    background: var(--gold);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px;
    animation: pulse-dot 2s ease-in-out infinite;
    box-shadow: 0 0 20px rgba(242,195,26,0.5);
    position: relative; z-index: 1;
}

.cs-heading { font-size: 1.6rem; font-weight: 800; color: #fff; margin-bottom: 0.5rem; line-height: 1.2; position: relative; z-index: 1; }
.cs-sub { font-size: 14px; color: rgba(255,255,255,0.65); margin-bottom: 1.25rem; line-height: 1.55; position: relative; z-index: 1; }
.cs-swahili {
    display: inline-block;
    background: rgba(242,195,26,0.14);
    border: 1px solid rgba(242,195,26,0.3);
    border-radius: 99px;
    padding: 0.45rem 1.25rem;
    font-size: 14px; font-weight: 700; color: var(--gold);
    margin-bottom: 2rem; position: relative; z-index: 1;
}

.cs-back {
    display: inline-flex; align-items: center; gap: 0.4rem;
    background: rgba(255,255,255,0.1); border: 1.5px solid rgba(255,255,255,0.2);
    border-radius: 10px; padding: 0.6rem 1.25rem;
    color: rgba(255,255,255,0.85); font-size: 13px; font-weight: 600;
    text-decoration: none; transition: all 0.15s;
    position: relative; z-index: 1;
}
.cs-back:hover { background: rgba(255,255,255,0.2); color: #fff; border-color: rgba(255,255,255,0.4); }
</style>

<div class="cs-wrap">
    <div class="cs-card">
        <div class="cs-logo">SW</div>

        <div class="cs-pulse-wrap">
            <div class="cs-pulse-ring"></div>
            <div class="cs-pulse-dot">👥</div>
        </div>

        <h1 class="cs-heading">Know Your Executives</h1>
        <p class="cs-sub">Meet the faces behind SWASA — coming soon!</p>
        <div class="cs-swahili">Tunakuja hivi karibuni!</div>

        <br>
        <a href="{% url 'attendance:dashboard' %}" class="cs-back">
            <span class="iconify" data-icon="mdi:arrow-left" data-width="15"></span>
            Back to Dashboard
        </a>
    </div>
</div>
{% endblock %}
