{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="csrf-token" content="{{ csrf_token }}">
<title>Set new password — SWASA Attendance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
    :root { --navy: #0D2472; --navy-deep: #081A52; --gold: #E6B325;
        --ink: #16203C; --muted: #5B6577; --line: #E5E8F0; --field-line: #D2D8E6;
        --bg: #EEF1F8; --white: #FFFFFF; --danger: #C0392B; --danger-bg: #FCEDEB; --danger-line: #F1C7C1; --green: #1A9E60; }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Montserrat', system-ui, sans-serif; color: var(--ink);
        background: radial-gradient(1000px 500px at 15% -10%, rgba(13,36,114,0.09), transparent 60%),
            radial-gradient(800px 460px at 100% 110%, rgba(230,179,37,0.07), transparent 55%), var(--bg);
        min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem 1rem; -webkit-font-smoothing: antialiased; }
    .card { width: 100%; max-width: 420px; background: var(--white); border: 1px solid var(--line);
        border-radius: 18px; overflow: hidden; box-shadow: 0 26px 60px -28px rgba(13,36,114,0.28); }
    .card-top { padding: 1.9rem 2rem 1.5rem; text-align: center; border-bottom: 1px solid var(--line); position: relative; }
    .card-top::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--navy), var(--gold)); }
    .brand-icon { width: 48px; height: 48px; border-radius: 14px; background: rgba(13,36,114,0.07); color: var(--navy);
        display: inline-flex; align-items: center; justify-content: center; margin-bottom: 0.9rem; }
    .card-top h1 { font-size: 1.3rem; font-weight: 700; letter-spacing: -0.02em; }
    .card-top-sub { margin-top: 0.3rem; font-size: 0.78rem; color: var(--muted); font-weight: 500; }
    .steps { display: flex; align-items: center; justify-content: center; margin-top: 1.25rem; }
    .step-item { display: flex; align-items: center; gap: 0.4rem; font-size: 0.7rem; font-weight: 600; color: #A2AAB9; }
    .step-item.active { color: var(--navy); }
    .step-item.done { color: var(--green); }
    .step-dot { width: 21px; height: 21px; flex-shrink: 0; border-radius: 50%; background: #ECEFF6; color: #97A0B2; display: flex; align-items: center; justify-content: center; font-size: 0.68rem; font-weight: 700; }
    .step-item.active .step-dot { background: var(--navy); color: #fff; }
    .step-item.done .step-dot { background: var(--green); color: #fff; }
    .step-item.done .step-dot::after { content: "✓"; font-size: 0.7rem; }
    .step-line { width: 24px; height: 1.5px; flex-shrink: 0; background: var(--line); margin: 0 0.5rem; }
    .step-line.done { background: var(--green); }
    .card-body { padding: 1.6rem 2rem 2rem; }
    .error-banner { display: flex; gap: 0.5rem; align-items: flex-start; background: var(--danger-bg);
        border: 1px solid var(--danger-line); border-left: 3px solid var(--danger); border-radius: 10px;
        padding: 0.65rem 0.85rem; font-size: 0.78rem; font-weight: 500; color: var(--danger); line-height: 1.45; margin-bottom: 1.1rem; }
    .error-banner .iconify { flex-shrink: 0; margin-top: 1px; }
    .field { margin-bottom: 0.9rem; }
    .field-label { display: block; font-size: 0.73rem; font-weight: 600; color: var(--ink); margin-bottom: 0.35rem; }
    .field-hint { font-size: 0.68rem; color: var(--muted); margin-top: 0.35rem; }
    .field-wrap { position: relative; }
    .field-input { width: 100%; padding: 0.75rem 2.9rem 0.75rem 0.9rem; font-family: inherit; font-size: 0.88rem; font-weight: 500;
        color: var(--ink); background: #FBFCFE; border: 1.5px solid var(--field-line); border-radius: 10px; outline: none;
        transition: border-color 0.15s, box-shadow 0.15s, background 0.15s; }
    .field-input::placeholder { color: #9AA3B5; font-weight: 400; }
    .field-input:focus { border-color: var(--navy); background: #fff; box-shadow: 0 0 0 3px rgba(13,36,114,0.12); }
    .pw-toggle { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); background: none; border: none;
        cursor: pointer; color: var(--muted); padding: 0.4rem; border-radius: 8px; display: flex; line-height: 0; transition: color 0.15s, background 0.15s; }
    .pw-toggle:hover { color: var(--navy); background: rgba(13,36,114,0.06); }
    .btn-submit { width: 100%; padding: 0.85rem; background: var(--navy); color: #fff; border: none; border-radius: 10px;
        font-family: inherit; font-size: 0.9rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.5rem; transition: background 0.15s, transform 0.05s; margin-top: 0.35rem; }
    .btn-submit:hover { background: var(--navy-deep); }
    .btn-submit:active { transform: translateY(1px); }
    .back-link { display: flex; align-items: center; justify-content: center; gap: 0.3rem; margin-top: 1.1rem;
        font-size: 0.78rem; font-weight: 600; color: var(--muted); text-decoration: none; transition: color 0.15s; }
    .back-link:hover { color: var(--navy); }
</style>
</head>
<body>
<main class="card">
    <div class="card-top">
        <div class="brand-icon"><span class="iconify" data-icon="mdi:lock-check-outline" data-width="24"></span></div>
        <h1>Set new password</h1>
        <div class="card-top-sub">Choose a strong password for your account</div>
        <div class="steps">
            <span class="step-item done"><span class="step-dot"></span> Your email</span>
            <span class="step-line done"></span>
            <span class="step-item done"><span class="step-dot"></span> Enter code</span>
            <span class="step-line done"></span>
            <span class="step-item active"><span class="step-dot">3</span> New password</span>
        </div>
    </div>
    <div class="card-body">
        {% if error %}
        <div class="error-banner" role="alert">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            <span>{{ error }}</span>
        </div>
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <div class="field">
                <label class="field-label" for="new_password">New password</label>
                <div class="field-wrap">
                    <input type="password" id="new_password" name="new_password" class="field-input" placeholder="Enter new password" minlength="8" required autocomplete="new-password">
                    <button type="button" class="pw-toggle" onclick="togglePw('new_password', this)" aria-label="Show password">
                        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>
                <div class="field-hint">At least 8 characters.</div>
            </div>
            <div class="field">
                <label class="field-label" for="confirm_password">Confirm password</label>
                <div class="field-wrap">
                    <input type="password" id="confirm_password" name="confirm_password" class="field-input" placeholder="Re-enter new password" minlength="8" required autocomplete="new-password">
                    <button type="button" class="pw-toggle" onclick="togglePw('confirm_password', this)" aria-label="Show password">
                        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn-submit">
                Set new password
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
            </button>
        </form>
        <a href="{% url 'login' %}" class="back-link">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
            Back to sign in
        </a>
    </div>
</main>
<script>
function togglePw(id, btn) {
    var input = document.getElementById(id);
    var showing = input.type === 'text';
    input.type = showing ? 'password' : 'text';
    btn.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
    btn.querySelector('svg').innerHTML = showing
        ? '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/>'
        : '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
}
</script>
</body>
</html>
