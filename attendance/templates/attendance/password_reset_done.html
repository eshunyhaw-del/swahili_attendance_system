<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Reset Link Sent - SWASA Attendance</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>
    <style>
        :root {
            --primary: #0D2472;
            --surface: #FFFFFF;
            --bg-main: #F4F6FB;
            --text-main: #0D1B3E;
            --text-muted: #8896AB;
            --border: #E4E9F2;
            --success: #1E9E5E;
            --success-light: rgba(30,158,94,0.1);
            --radius-lg: 20px;
            --shadow-lg: 0 10px 25px -5px rgba(13,36,114,0.1);
            --transition: all 0.2s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
            background: var(--bg-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .success-card {
            background: var(--surface);
            border-radius: var(--radius-lg);
            max-width: 440px;
            width: 100%;
            padding: 2.5rem;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-lg);
            text-align: center;
            position: relative;
        }

        .success-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), #1B3A9C);
            border-radius: var(--radius-lg) var(--radius-lg) 0 0;
        }

        .icon-circle {
            width: 64px;
            height: 64px;
            background: var(--success-light);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.25rem;
        }

        h2 { 
            font-size: 1.5rem; 
            font-weight: 700; 
            margin-bottom: 0.5rem; 
            color: var(--text-main); 
            letter-spacing: -0.02em;
        }

        p { 
            color: var(--text-muted); 
            margin-bottom: 1.75rem; 
            font-size: 0.85rem;
            line-height: 1.5;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            background: var(--primary);
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.85rem;
            transition: var(--transition);
        }

        .btn:hover {
            background: #091A55;
            transform: translateY(-1px);
        }

        @media (max-width: 480px) {
            .success-card { padding: 1.5rem; }
            h2 { font-size: 1.3rem; }
        }
    </style>
</head>
<body>
<div class="success-card">
    <div class="icon-circle">
        <span class="iconify" data-icon="lucide:mail-check" data-width="32" data-height="32" style="color: var(--success);"></span>
    </div>
    <h2>Check your email</h2>
    <p>We've sent you a password reset link. Click the link in the email to create a new password.</p>
    <a href="{% url 'login' %}" class="btn">
        <span class="iconify" data-icon="lucide:log-in"></span>
        Return to login
    </a>
</div>
</body>
</html>
