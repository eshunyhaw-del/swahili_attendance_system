{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>Set New Password - SWASA Attendance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
<script>(function(){var t=localStorage.getItem('swasa_theme')||'light';document.documentElement.setAttribute('data-theme',t);})();</script>
<script src="{% static 'js/iconify.min.js' %}"></script>
<style>
        :root {
            --primary: #0D2472;
            --primary-hover: #091A55;
            --primary-light: rgba(13,36,114,0.08);
            --surface: #FFFFFF;
            --bg-main: #EEF1F8;
            --text-main: #1A1A2E;
            --text-muted: #6B7280;
            --border: #E5E8F0;
            --radius-lg: 20px;
            --radius-sm: 8px;
            --shadow-lg: 0 10px 25px -5px rgba(13,36,114,0.1);
            --transition: all 0.2s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .reset-card {
            background: var(--surface);
            border-radius: var(--radius-lg);
            max-width: 440px;
            width: 100%;
            padding: 2.5rem;
            box-shadow: var(--shadow-lg);
            position: relative;
        }

        .reset-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), #1B3A9C, #F2C31A);
            border-radius: var(--radius-lg) var(--radius-lg) 0 0;
        }

        .icon-circle {
            width: 56px;
            height: 56px;
            background: var(--primary-light);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.25rem;
        }

        h2 { 
            font-size: 1.5rem; 
            font-weight: 700; 
            margin-bottom: 0.5rem; 
            color: var(--text-main); 
            text-align: center;
            letter-spacing: -0.02em;
        }

        p { 
            color: var(--text-muted); 
            margin-bottom: 1.75rem; 
            text-align: center;
            font-size: 0.85rem;
        }

        .input-wrapper {
            position: relative;
            margin-bottom: 1.25rem;
        }

        input {
            width: 100%; 
            padding: 0.85rem 1rem 0.85rem 2.75rem;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            color: var(--text-main);
            background: var(--surface);
            transition: var(--transition);
        }

        input:focus { 
            outline: none; 
            border-color: var(--primary); 
            box-shadow: 0 0 0 3px var(--primary-light); 
        }

        .input-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1.1rem;
            pointer-events: none;
            transition: var(--transition);
        }

        input:focus + .input-icon {
            color: var(--primary);
        }

        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            padding: 0;
            transition: var(--transition);
        }

        .password-toggle:hover {
            color: var(--primary);
        }

        button {
            background: var(--primary);
            color: white;
            width: 100%;
            padding: 0.85rem;
            border: none;
            border-radius: var(--radius-sm);
            font-weight: 700;
            font-size: 0.9rem;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        button:hover { 
            background: var(--primary-hover); 
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(13,36,114,0.15);
        }

        .errorlist {
            list-style: none;
            background: rgba(211, 47, 47, 0.1);
            color: #D32F2F;
            font-size: 0.75rem;
            padding: 0.5rem 0.75rem;
            border-radius: var(--radius-sm);
            margin-top: 0.5rem;
            font-weight: 500;
        }

        .helptext {
            font-size: 0.65rem;
            color: var(--text-muted);
            margin-top: 0.25rem;
            display: block;
        }

        @media (max-width: 480px) {
            .reset-card { padding: 1.5rem; }
            h2 { font-size: 1.3rem; }
        }
        html[data-theme="dark"] body { background: #0F1923 !important; }
        html[data-theme="dark"] .reset-card { background: #1E2A3B !important; border-color: #2E3D50 !important; color: #E8EDF5; }
        html[data-theme="dark"] h2 { color: #E8EDF5; }
        html[data-theme="dark"] p { color: #8896AB; }
        html[data-theme="dark"] input { background: #162131 !important; color: #E8EDF5 !important; border-color: #2E3D50 !important; }
        html[data-theme="dark"] input:focus { border-color: #F2C31A !important; box-shadow: 0 0 0 3px rgba(242,195,26,0.15) !important; }
        html[data-theme="dark"] .icon-circle { background: rgba(242,195,26,0.1) !important; }
        html[data-theme="dark"] .icon-circle .iconify { color: #F2C31A !important; }
        html[data-theme="dark"] .password-toggle { color: #8896AB !important; }
        html[data-theme="dark"] .password-toggle:hover { color: #F2C31A !important; }
</style>
</head>
<body>
<div class="reset-card">
<div class="icon-circle">
<span class="iconify" data-icon="lucide:lock" data-width="28" data-height="28" style="color: var(--primary);"></span>
</div>
<h2>Create new password</h2>
<p>Enter your new password below.</p>
    
<form method="post">
        {% csrf_token %}
        
<div class="input-wrapper">
            {{ form.new_password1 }}
<span class="input-icon iconify" data-icon="lucide:lock"></span>
<button type="button" class="password-toggle" data-target="id_new_password1">
<span class="iconify eye-icon" data-icon="lucide:eye"></span>
</button>
</div>
<div class="helptext">Must be at least 8 characters</div>
        {{ form.new_password1.errors }}
        
<div class="input-wrapper">
            {{ form.new_password2 }}
<span class="input-icon iconify" data-icon="lucide:shield-check"></span>
<button type="button" class="password-toggle" data-target="id_new_password2">
<span class="iconify eye-icon" data-icon="lucide:eye"></span>
</button>
</div>
        {{ form.new_password2.errors }}
        
<button type="submit">
Reset Password
</button>
</form>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        document.querySelectorAll('.password-toggle').forEach(toggle => {
            toggle.addEventListener('click', function(e) {
                e.preventDefault();
                const targetId = this.getAttribute('data-target');
                const input = document.getElementById(targetId);
                const icon = this.querySelector('.eye-icon');
                if (input && icon) {
                    const isPassword = input.type === 'password';
                    input.type = isPassword ? 'text' : 'password';
                    icon.setAttribute('data-icon', isPassword ? 'lucide:eye-off' : 'lucide:eye');
                    input.focus();
                }
            });
        });
    });
</script>
</body>
</html>
